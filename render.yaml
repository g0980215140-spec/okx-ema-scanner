services:
  - type: web
    name: okx-ema-scanner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SCAN_INTERVAL_SECONDS
        value: "300"
      - key: SCAN_WORKERS
        value: "8"
